name: Multiplatform Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: lazyfossil
            artifact_name: lazyfossil-linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: lazyfossil.exe
            artifact_name: lazyfossil-windows
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: lazyfossil
            artifact_name: lazyfossil-macos

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary_name }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts/

      - name: Stage release files
        run: |
          mkdir -p release-files
          cp all-artifacts/lazyfossil-linux/lazyfossil release-files/lazyfossil-linux
          cp all-artifacts/lazyfossil-windows/lazyfossil.exe release-files/lazyfossil-windows.exe
          cp all-artifacts/lazyfossil-macos/lazyfossil release-files/lazyfossil-macos

      - name: Create and upload GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-files/lazyfossil-linux
            release-files/lazyfossil-windows.exe
            release-files/lazyfossil-macos

