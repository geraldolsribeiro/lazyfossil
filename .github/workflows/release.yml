name: Multiplatform Release

on:
  push:
    tags:
      - 'v*'

# on: push

permissions:
  contents: write # Grants permission to create GitHub Releases

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: lazyfossil
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: lazyfossil.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: lazyfossil

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Build Binary
      run: cargo build --release --target ${{ matrix.target }}
      # target/x86_64-unknown-linux-gnu/release/lazyfossil
        
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: lazyfossil-${{ matrix.os }}
        path: target/${{ matrix.target }}/release/${{ matrix.binary_name }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts/ # Downloads each artifact into its own subfolder

      - name: Stage Release Files
        run: |
          mkdir release-files
          # Flatten the downloaded artifact subdirectories into one folder
          cp all-artifacts/lazyfossil-ubuntu-latest/lazyfossil      release-files/lazyfossil-linux
          cp all-artifacts/lazyfossil-windows-latest/lazyfossil.exe release-files/lazyfossil-windows.exe
          cp all-artifacts/lazyfossil-macos-latest/lazyfossil       release-files/lazyfossil-macos

      - name: Prepare release media note
        run: |
          echo "Release media can be refreshed with docs/vhs and scripts/export-media.sh for ${{ github.ref_name }}"

      - name: Create and Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-files/lazyfossil-linux
            release-files/lazyfossil-windows.exe
            release-files/lazyfossil-macos

