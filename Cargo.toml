[package]
name = "lazyfossil"
version = "0.5.2"
edition = "2021"
description = "A lazygit-inspired TUI for Fossil SCM"
license = "MIT"
readme = "README.md"
homepage = "https://lazyfossil.org"
repository = "https://github.com/geraldolsribeiro/lazyfossil"
keywords = ["fossil", "tui", "terminal", "scm"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "Cargo.toml",
    "README.md",
    "src/**",
    "doc/images/**",
    "site/**",
]

[dependencies]
anyhow = "1"
crossterm = "0.29"
ratatui = "0.30"
