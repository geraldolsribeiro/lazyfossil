[package]
name = "lazyfossil"
version = "0.7.2"
edition = "2021"
description = """
Make it easy to work with Fossil from the terminal:
browse files, see history, preview changes, and commit or sync without extra friction.
"""
authors = [ "Geraldo Ribeiro <geraldolsribeiro@gmail.com>" ]
license = "MIT"
readme = "README.md"
homepage = "https://lazyfossil.org"
repository = "https://github.com/geraldolsribeiro/lazyfossil"
keywords = ["fossil", "tui", "terminal", "scm"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "Cargo.toml",
    "README.md",
    "src/**",
    "doc/images/**",
    "site/**",
]

[dependencies]
anyhow = "1"
crossterm = "0.29"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
