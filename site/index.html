<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>lazyfossil — Coming Soon</title>
    <meta name="description" content="lazyfossil is a lazygit-inspired terminal UI for Fossil SCM." />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1115;
        --panel: #171a21;
        --text: #eef2ff;
        --muted: #a7b0c0;
        --accent: #7dd3fc;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #1c2230 0%, var(--bg) 55%);
        color: var(--text);
        font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(720px, calc(100vw - 32px));
        padding: 40px 28px;
        background: color-mix(in srgb, var(--panel) 92%, transparent);
        border: 1px solid rgba(255,255,255,.08);
        border-radius: 24px;
        box-shadow: 0 24px 80px rgba(0,0,0,.35);
        text-align: center;
      }
      img {
        width: min(320px, 80%);
        height: auto;
        display: block;
        margin: 0 auto 24px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 5vw, 3.5rem);
        line-height: 1.05;
      }
      .tag {
        display: inline-block;
        margin-bottom: 16px;
        padding: 6px 12px;
        border-radius: 999px;
        background: rgba(125, 211, 252, .12);
        color: var(--accent);
        font-weight: 700;
        letter-spacing: .08em;
        text-transform: uppercase;
        font-size: .78rem;
      }
      p { margin: 0 auto 16px; max-width: 60ch; color: var(--muted); }
      a { color: var(--accent); text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <img src="logo.png" alt="lazyfossil logo" />
      <div class="tag">Coming Soon</div>
      <h1>lazyfossil</h1>
      <p>
        A lazygit-inspired terminal UI for Fossil SCM.
        Browse your working tree, inspect history, and manage commits from a fast,
        keyboard-friendly interface.
      </p>
      <p>Project website: <a href="https://lazyfossil.org">https://lazyfossil.org</a></p>
    </main>
  </body>
</html>
